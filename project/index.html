<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projet</title>
    <link rel="icon" href="../assets/favicon.png" />
    <link rel="preload" href="../assets/fonts/FS Industrie Cd Regular.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="../assets/fonts/FS Industrie Cd Bold.otf" as="font" type="font/otf" crossorigin />
    <link rel="stylesheet" href="../assets/css/site.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="../">FANILO BINI</a>
        <nav class="nav">
          <a class="nav__link" href="../#projects-section">Travaux</a>
          <a class="nav__link" href="../infos/">Infos</a>
          <a class="nav__link" href="https://www.etsy.com/shop/Pamplemoosse" target="_blank" rel="noopener noreferrer">Shop</a>
          <a class="nav__link" href="https://www.instagram.com/fanilo.bini" target="_blank" rel="noopener noreferrer">Insta</a>
          <a class="nav__link" href="https://www.malt.fr/profile/fanilobini" target="_blank" rel="noopener noreferrer">Malt</a>
        </nav>
      </div>
    </header>

    <div class="project-hero" id="projectHero" aria-label="Bannière projet"></div>

    <main class="project project--detail">
      <div class="project__header project__header--detail">
        <div class="project__titleCol">
          <h1 class="project__title" id="projectTitle"></h1>
        </div>
        <div class="project__metaCol">
          <div class="project__body" id="projectBody"></div>
          <aside class="project__infos" id="projectInfos"></aside>
          <div class="project__credit">© Fanilo Bini</div>
        </div>
      </div>

      <section class="gallery" id="gallery" aria-label="Galerie"></section>
    </main>

    <footer class="footer">
      <div class="footer__inner">
        <div class="footer__left">
          <div class="footer__title">FANILO BINI</div>
          <div class="footer__line">EMAIL: <a class="footer__link" href="mailto:FANILO.F@GMAIL.COM">FANILO.F@GMAIL.COM</a></div>
        </div>
        <div class="footer__right">
          <a class="footer__link" href="https://www.instagram.com/fanilo.bini" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
          <a class="footer__link" href="https://www.linkedin.com/in/fanilo-bini" target="_blank" rel="noopener noreferrer">LINKEDIN</a>
        </div>
      </div>
    </footer>
    <button class="back-to-top" type="button" aria-label="Retour en haut">Top</button>

    <script src="../assets/js/projects.js"></script>
    <script src="../assets/js/animations.js"></script>
    <script src="../assets/js/block-media-save.js"></script>
    <script src="../assets/js/back-to-top.js"></script>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const slug = params.get('p');
        if (!slug) {
          location.href = '../';
          return;
        }

        window.PortfolioData.loadProjects()
          .then((projects) => {
            const p = window.PortfolioData.findProject(projects, slug);
            if (!p) {
              location.href = '../';
              return;
            }

            document.title = p.title ? `${p.title} – Portfolio` : 'Projet – Portfolio';

            const hero = document.getElementById('projectHero');
            if (hero && p.banner) {
              if (p.bannerType === 'video') {
                // Create video banner
                const video = document.createElement('video');
                video.autoplay = true;
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                video.preload = 'metadata';
                video.src = window.PortfolioData.resolveAssetPath(p.banner);
                video.className = 'project-hero__video';
                hero.innerHTML = '';
                hero.appendChild(video);
              } else {
                // Use image banner
                hero.style.backgroundImage = `url("${window.PortfolioData.resolveAssetPath(p.banner)}")`;
              }
            }

            const title = document.getElementById('projectTitle');
            if (title) title.textContent = p.title ?? p.name ?? '';

            const body = document.getElementById('projectBody');
            if (body) body.textContent = p.main_body ?? '';

            const infos = document.getElementById('projectInfos');
            if (infos) {
              const infoText = p.infos ?? '';
              const lines = infoText.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
              const frag = document.createDocumentFragment();

              const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/g;

              function appendWithLinks(container, text) {
                if (!text) return;
                let lastIndex = 0;
                for (const match of text.matchAll(urlRegex)) {
                  const url = match[0];
                  const index = match.index ?? 0;
                  if (index > lastIndex) {
                    container.appendChild(document.createTextNode(text.slice(lastIndex, index)));
                  }
                  const link = document.createElement('a');
                  link.href = url.startsWith('http') ? url : `https://${url}`;
                  link.target = '_blank';
                  link.rel = 'noopener noreferrer';
                  link.textContent = url;
                  container.appendChild(link);
                  lastIndex = index + url.length;
                }
                if (lastIndex < text.length) {
                  container.appendChild(document.createTextNode(text.slice(lastIndex)));
                }
              }

              for (const line of lines) {
                const row = document.createElement('div');
                const parts = line.split(':');
                if (parts.length > 1) {
                  const label = parts.shift().trim();
                  const value = parts.join(':').trim();
                  const strong = document.createElement('strong');
                  strong.textContent = `${label}:`;
                  row.appendChild(strong);
                  if (value) {
                    row.appendChild(document.createTextNode(' '));
                    appendWithLinks(row, value);
                  }
                } else {
                  appendWithLinks(row, line);
                }
                frag.appendChild(row);
              }

              infos.innerHTML = '';
              infos.appendChild(frag);
            }

            const gallery = document.getElementById('gallery');
            if (!gallery) return;

            /* ── Font Trial mode for type:"typo" projects ── */
            if (p.type === 'typo' && Array.isArray(p.fonts) && p.fonts.length) {
              // Block right-click & drag on the entire page for typo projects
              document.addEventListener('contextmenu', (e) => e.preventDefault());
              document.addEventListener('dragstart', (e) => e.preventDefault());
              document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && (e.key === 's' || e.key === 'S' || e.key === 'u' || e.key === 'U')) {
                  e.preventDefault();
                }
              });

              // Render the normal gallery first (images/videos)
              const items = Array.isArray(p.media) ? p.media : [];
              const frag = document.createDocumentFragment();
              for (const m of items) {
                const wrap = document.createElement('div');
                wrap.className = 'gallery__item';
                if (m.type === 'video') {
                  const v = document.createElement('video');
                  v.autoplay = true; v.muted = true; v.loop = true;
                  v.playsInline = true; v.preload = 'metadata';
                  v.src = window.PortfolioData.resolveAssetPath(m.src);
                  wrap.appendChild(v);
                } else {
                  const img = document.createElement('img');
                  img.loading = 'lazy';
                  img.alt = p.title ?? 'Image';
                  img.src = window.PortfolioData.resolveAssetPath(m.src);
                  wrap.appendChild(img);
                }
                frag.appendChild(wrap);
              }
              gallery.innerHTML = '';
              gallery.appendChild(frag);

              // Font trial section AFTER the gallery
              const trialSection = document.createElement('section');
              trialSection.className = 'font-trial';

              const PLACEHOLDER = 'Essaye moi';

              for (const fontDef of p.fonts) {
                const fontUrl = window.PortfolioData.resolveAssetPath(fontDef.file);
                const familyId = 'Trial_' + Math.random().toString(36).slice(2, 10);

                (async () => {
                  try {
                    const res = await fetch(fontUrl);
                    const buf = await res.arrayBuffer();
                    const face = new FontFace(familyId, buf);
                    await face.load();
                    document.fonts.add(face);
                  } catch (err) {
                    console.error('Font load failed:', err);
                    return;
                  }

                  const card = document.createElement('div');
                  card.className = 'font-trial__card';

                  // Heading: "Essaie la Typo ↓"
                  const heading = document.createElement('div');
                  heading.className = 'font-trial__heading';
                  heading.innerHTML = 'Essaie la Typo <span>&#8595;</span>';
                  card.appendChild(heading);

                  // Hidden input for keyboard capture
                  const input = document.createElement('input');
                  input.type = 'text';
                  input.className = 'font-trial__hidden-input';
                  input.value = '';
                  input.maxLength = 100;
                  input.autocomplete = 'off';
                  input.spellcheck = false;
                  input.setAttribute('aria-label', 'Texte de test pour la typographie');
                  let showPlaceholder = true;
                  card.appendChild(input);

                  // Canvas box (black border, clickable to focus input)
                  const canvasWrap = document.createElement('div');
                  canvasWrap.className = 'font-trial__canvas-wrap';
                  canvasWrap.addEventListener('click', () => {
                    input.focus();
                  });

                  const canvas = document.createElement('canvas');
                  canvasWrap.appendChild(canvas);
                  card.appendChild(canvasWrap);

                  // Controls row (right-aligned size slider)
                  const controls = document.createElement('div');
                  controls.className = 'font-trial__controls';

                  const sizeWrap = document.createElement('div');
                  sizeWrap.className = 'font-trial__size';

                  const sizeLabel = document.createElement('span');
                  sizeLabel.textContent = '48px';

                  const slider = document.createElement('input');
                  slider.type = 'range';
                  slider.min = '16';
                  slider.max = '120';
                  slider.value = '48';

                  sizeWrap.appendChild(sizeLabel);
                  sizeWrap.appendChild(slider);
                  controls.appendChild(sizeWrap);
                  card.appendChild(controls);

                  trialSection.appendChild(card);

                  function render() {
                    const text = showPlaceholder && !input.value ? PLACEHOLDER : input.value;
                    const isPlaceholder = showPlaceholder && !input.value;
                    const fontSize = parseInt(slider.value, 10);
                    const dpr = window.devicePixelRatio || 1;
                    const ctx = canvas.getContext('2d');

                    ctx.font = `${fontSize}px "${familyId}"`;
                    const metrics = ctx.measureText(text);
                    const textW = Math.ceil(metrics.width) + 20;
                    const textH = Math.ceil(fontSize * 1.4);

                    const wrapW = canvasWrap.clientWidth - 32 || 600;
                    const displayW = Math.max(textW, wrapW);

                    canvas.width = displayW * dpr;
                    canvas.height = textH * dpr;
                    canvas.style.width = displayW + 'px';
                    canvas.style.height = textH + 'px';

                    ctx.scale(dpr, dpr);
                    ctx.clearRect(0, 0, displayW, textH);
                    ctx.fillStyle = isPlaceholder
                      ? '#aaa'
                      : (getComputedStyle(document.documentElement).getPropertyValue('--fg').trim() || '#000');
                    ctx.font = `${fontSize}px "${familyId}"`;
                    ctx.textBaseline = 'middle';
                    ctx.fillText(text, 4, textH / 2);
                  }

                  input.addEventListener('input', () => {
                    const cleaned = input.value.replace(/[^A-Za-z0-9 ]/g, '');
                    if (cleaned !== input.value) input.value = cleaned;
                    render();
                  });

                  input.addEventListener('focus', () => {
                    showPlaceholder = false;
                    render();
                  });

                  input.addEventListener('blur', () => {
                    if (!input.value) showPlaceholder = true;
                    render();
                  });

                  slider.addEventListener('input', () => {
                    sizeLabel.textContent = slider.value + 'px';
                    render();
                  });

                  window.addEventListener('resize', render);
                  render();
                })();
              }

              gallery.parentNode.insertBefore(trialSection, gallery);
              return;
            }

            /* ── Normal gallery ── */
            const items = Array.isArray(p.media) ? p.media : [];
            const frag = document.createDocumentFragment();

            for (const m of items) {
              const wrap = document.createElement('div');
              wrap.className = 'gallery__item';

              if (m.type === 'video') {
                const v = document.createElement('video');
                v.autoplay = true;
                v.muted = true;
                v.loop = true;
                v.playsInline = true;
                v.preload = 'metadata';
                v.src = window.PortfolioData.resolveAssetPath(m.src);
                wrap.appendChild(v);
              } else {
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.alt = p.title ?? 'Image';
                img.src = window.PortfolioData.resolveAssetPath(m.src);
                wrap.appendChild(img);
              }

              frag.appendChild(wrap);
            }

            gallery.innerHTML = '';
            gallery.appendChild(frag);
          })
          .catch(() => {
            location.href = '../';
          });
      })();
    </script>
  </body>
</html>
